[build]
  command = "npm run export:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Public API endpoints inlined into the web bundle at build time (same
# EXPO_PUBLIC_* vars eas.json's production profile sets for native builds).
# These values WIN over anything set in the Netlify UI — netlify.toml context
# environment wins over UI environment variables, so this file is the only
# place to change them. Point the branch-deploy ones at a staging URL instead
# if a separate staging backend ever exists — same values as production for
# now since there isn't one yet.
#
# EXPO_PUBLIC_DEPLOY_CONTEXT tags which Netlify context built this bundle.
# Currently drives more.tsx's SEED_DATA_ENABLED (only "test" shows the Seed
# test data row); reuse this same var for any other test-only-on-web behavior
# rather than adding a new single-purpose flag per feature.
[context.production.environment]
  EXPO_PUBLIC_DICT_API_URL = "https://dict.wordbankapp.com"
  EXPO_PUBLIC_WORDS_FEED_API_URL = "https://words.wordbankapp.com/v1"
  EXPO_PUBLIC_DEPLOY_CONTEXT = "production"

[context.branch-deploy.environment]
  EXPO_PUBLIC_DICT_API_URL = "https://dict.wordbankapp.com"
  EXPO_PUBLIC_WORDS_FEED_API_URL = "https://words.wordbankapp.com/v1"
  EXPO_PUBLIC_DEPLOY_CONTEXT = "test"

# Static export (web.output: "static") is a real static site, not an SPA —
# Expo's own docs confirm no catch-all/SPA redirect is needed. Just cache the
# hashed, immutable JS/CSS chunks aggressively.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
